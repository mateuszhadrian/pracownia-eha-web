# ── Gdzie zapisywana jest treść ──────────────────────────────────────────
backend:
  name: github
  repo: mateuszhadrian/pracownia-eha-web # właściciel/nazwa repo
  branch: main
  # Worker-logowania (OAuth proxy) — osobny deploy dla eha (Etap 2):
  base_url: https://auth.pracownia-eha.pl
  # Bez tego panel na localhoscie wysyła site_id=cms.netlify.com (dziedzictwo
  # Netlify w Sveltii) i wpada na ALLOWED_DOMAINS Workera (gotcha z poprzedniego wdrożenia):
  site_domain: pracownia-eha.pl

# ── Gdzie trafiają media: Cloudflare R2 ──────────────────────────────────
# Secret Access Key NIE trafia do tego pliku — Sveltia poprosi o niego
# w panelu przy pierwszym uploadzie i trzyma go w pamięci przeglądarki.
# account_id i access_key_id są jawne (autoryzuje dopiero sekret).
# Token R2 `eha-media-sveltia` (Object R&W, scope: tylko bucket `eha-media`).
media_libraries:
  # Nazwy WGRYWANYCH plików przez te same reguły co slug wpisu (blok `slug:`
  # niżej): spacje → myślniki, polskie znaki transliterowane, małe litery.
  # Bez tego plik z telefonu ląduje w R2 jako "Img 9635.mp4" (stan z
  # 2026-09-17) — działa (przeglądarka koduje URL), ale adresy są brzydkie,
  # a instrukcja klienta obiecuje, że panel poprawi nazwę. Zakres `all`
  # obejmuje też upload do R2 (dialog Select File → Upload; sprawdzone
  # w bundle'u 0.178.0). Nazwy plików już wgranych NIE zmienia.
  all:
    slugify_filename: true
  cloudflare_r2:
    # ⚠️ Account ID = 32 znaki hex (Cloudflare → R2 → Overview → Account ID),
    # NIE „Token value" z ekranu tworzenia tokenu.
    account_id: "a1f687532595bb8659c557adba293d53"
    access_key_id: "ad81e69ebb1ab90a868a9b03e7559d58"
    bucket: "eha-media"
    public_url: "https://media.pracownia-eha.pl" # custom domain bucketa
    prefix: "realizacje/" # pliki wewnątrz bucketa w podfolderze
    jurisdiction: "eu"

# ── Czyste JSON-y: pomijaj niewypełnione pola opcjonalne (np. liveUrl) ────
output:
  omit_empty_optional_fields: true

# ── Nazwy plików wpisów: zawsze czyste ASCII ─────────────────────────────
# Nazwa pliku powstaje z pola „Slug" (patrz `slug:` w kolekcji niżej), a to
# pole klient wypełnia ręcznie — często wklejając tekst z telefonu albo
# z aplikacji Apple. Taki tekst bywa zapisany w formie ROZŁOŻONEJ (NFD: „ą"
# jako „a" + ogonek); wygląda identycznie, ale to inne bajty. Skutek na macOS:
# git trzyma w indeksie nazwę NFD, a odczytuje z dysku NFC, więc ten sam plik
# widać dwa razy — raz jako śledzony, raz jako nieśledzony. Przypadkowe
# `git add .` zrobiłoby z tego DWA wpisy na Linuksie i wywróciło test
# unikalności slugów (zdarzyło się 2026-08-06, trzy realizacje).
# `clean_accents` transliteruje polskie znaki (Sveltia ma wbudowaną tablicę:
# ą→a, ć→c, ę→e, ł→l, ń→n, ś→s, ź→z, ż→z), `encoding: ascii` wycina resztę.
# Dotyczy WYŁĄCZNIE nazwy pliku — tytuł, opis i wartość pola „Slug" zostają
# takie, jak wpisał klient. Istniejących plików nie rusza (przemianowanie
# następuje dopiero przy zmianie pola „Slug" w panelu).
slug:
  encoding: "ascii"
  clean_accents: true

# ── PL-only: zwykłe pola, bez obiektów {pl,en} ────────────────────────────
# BEZ pola „Kategoria" (E5 — eha nie ma kategorii). Schemat docelowy §6.1
# (place, paras[] zamiast description; Etap 2). Zmiana zawsze
# w TRZECH miejscach naraz (src/content.schema.ts / ten plik /
# src/components/sections/work/*) — reguła cms-realizacje.

collections:
  - name: "realizacje"
    label: "Realizacje"
    label_singular: "Realizacja"
    folder: "src/content/realizacje" # tu leżą pliki JSON kolekcji
    extension: "json"
    format: "json"
    create: true # pozwól DODAWAĆ nowe realizacje
    delete: true # pozwól USUWAĆ realizacje
    identifier_field: "title" # co pokazać na liście wpisów
    slug: "{{fields.slug}}" # nazwa pliku = wartość pola slug
    summary: "{{fields.title}} — {{fields.place}} ({{fields.year}})"
    fields:
      # Z tego pola przy TWORZENIU wpisu powstaje nazwa pliku, a z nazwy
      # pliku — stały link podstrony /realizacje/<nazwa>/ (sesja linków,
      # docs/analiza-linki-realizacji.md). Sveltia 0.178.0 przy późniejszej
      # zmianie pola NIE przemianowuje pliku (zmierzone 2026-09-17), więc
      # link zostaje stary — i dobrze, bo rozesłane linki nie mogą się
      # zrywać. Hint mówi to klientowi wprost.
      - {
          label: "Adres linku (slug, np. dom-z-bala-czernica)",
          name: "slug",
          widget: "string",
          hint: "Ustalany przy tworzeniu realizacji: z niego powstaje stały link pracownia-eha.pl/realizacje/…, który można wysyłać ludziom. Małe litery i myślniki, bez polskich znaków. Późniejsza zmiana tego pola NIE zmienia linku.",
        }
      - {
          label: "Kolejność (mniejsze = wyżej)",
          name: "order",
          widget: "number",
          value_type: "int",
          default: 10,
        }
      - { label: "Tytuł", name: "title", widget: "string" }
      - {
          label: "Miejscowość (np. Czernica — na stronie wielkimi literami)",
          name: "place",
          widget: "string",
        }
      - { label: "Rok realizacji (np. 2023)", name: "year", widget: "string" }

      # ── Opis: lista akapitów ──────────────────────────────────────────
      # Jeden akapit = jedna pozycja listy (design: 3 akapity). Dzięki temu
      # klient nie musi pamiętać o pustych liniach w jednym polu tekstowym.
      - label: "Opis (akapity)"
        name: "paras"
        widget: "list"
        label_singular: "Akapit"
        field: { label: "Treść akapitu", name: "para", widget: "text" }
        hint: "Najlepiej 3 akapity — tak jak w projekcie strony. Minimum 1."
        min: 1 # schemat Zod wymaga ≥1 akapitu

      # ── Galeria detalu ────────────────────────────────────────────────
      # Osobnego pola „Kafel (cover)" NIE MA (remont panelu, D-RP2): kaflem
      # realizacji jest PIERWSZA pozycja galerii — dlatego musi być zdjęciem
      # (pilnuje tego schemat Zod, panel nie umie warunku „na tej pozycji").
      # Pozycja to WARIANT: albo zdjęcie, albo film — nigdy oba naraz (D-RP1).
      # Wariantami steruje `types` Sveltii; klucz `type` w JSON-ie dopisuje
      # sam panel. „Zdjęcie" stoi pierwsze celowo: domyślny wybór ma być
      # poprawny także na pozycji nr 1.
      - label: "Galeria (pierwsza pozycja = kafel na liście)"
        name: "gallery"
        widget: "list"
        label_singular: "Pozycja galerii"
        # Panel NIE zablokuje zapisu z filmem na pierwszej pozycji: ma
        # walidację wyłącznie pojedynczych pól (wymagane / wzorzec), bez
        # żadnego hooka na cały wpis — sprawdzone w binarium 0.170.0.
        # Regułę egzekwuje schemat Zod (build staje), więc jedyne, co panel
        # może zrobić, to powiedzieć o niej ZANIM klient kliknie zapis.
        hint: >-
          Pierwsza pozycja to okładka widoczna na liście realizacji — musi
          być zdjęciem. Film dodaj jako drugą lub dalszą pozycję. Rodzaju
          dodanej pozycji nie da się zmienić: usuń ją i dodaj nową.
        min: 1 # schemat Zod wymaga ≥1 pozycji
        types:
          - label: "Zdjęcie"
            name: "photo"
            summary: "{{fields.image}}"
            fields:
              - { label: "Zdjęcie", name: "image", widget: "image" }
              - {
                  label: "Kadr (object-position, np. 50% 42%)",
                  name: "position",
                  widget: "string",
                  required: false,
                }
          - label: "Film"
            name: "video"
            summary: "{{fields.video}}"
            fields:
              - {
                  # Plan A ze spike'a Etapu 2: widget file wgrywa MP4 do R2.
                  # Limity: H.264+AAC, 1080p, ≤ ~30 MB (reguła cms-realizacje).
                  label: "Wideo MP4 (miniatura powstanie sama z klatki filmu)",
                  name: "video",
                  widget: "file",
                }
              - {
                  # Podwójna rola: podpis przy znaczku play ORAZ środek filmu,
                  # z którego wycinana jest miniatura. Puste = klatka z 1 s.
                  label: "Długość wideo (np. 0:24 — podpis i środek miniatury)",
                  name: "duration",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Kadr (object-position, np. 50% 42%)",
                  name: "position",
                  widget: "string",
                  required: false,
                }

      # ── Tabela parametrów detalu ──
      - label: "Parametry (specs)"
        name: "specs"
        widget: "list"
        label_singular: "Parametr"
        summary: "{{fields.label}}: {{fields.value}}"
        hint: >-
          Opcjonalne. Jeśli chcesz pokazać tabelę parametrów, wzór
          z projektu to 7 par: Rodzaj obiektu, Zakres prac, Powierzchnia,
          Czas realizacji, Materiał, Ciesiołka/Zaprawa, Rok zakończenia.
          Bez parametrów blok w ogóle się nie wyświetla.
        required: false # pusta lista = brak bloku PARAMETRY w detalu
        fields:
          - {
              label: "Etykieta (np. MATERIAŁY / BLAT / ZAKRES)",
              name: "label",
              widget: "string",
            }
          - { label: "Wartość", name: "value", widget: "string" }

      # ── Inne realizacje z inwestycji (docs/analiza-inne-realizacje.md) ──
      # Lista identyfikatorów innych realizacji = NAZW PLIKÓW: relacja
      # zapisuje `{{slug}}` wpisu, a to w Sveltii nazwa pliku, NIE pole
      # „Slug" (zweryfikowane 2026-11-03 na 0.178.0 — wpis Milęcic: plik
      # `…-milecicach`, pole `…-milęcicach`, zapisało się `…-milecicach`),
      # czyli ten sam identyfikator co adres /realizacje/<plik>/.
      # Filtr wyklucza edytowany wpis z selecta; `dropdown_threshold: 0` =
      # zawsze select (domyślnie przy ≤ 5 opcjach panel rysuje przyciski
      # radiowe i zmieniałby wygląd sam przy kolejnej realizacji).
      # Duplikatów i realizacji usuniętych później panel NIE pilnuje —
      # pomija je build (resolveRelated w work-data.ts). Pole jest OSTATNIE,
      # bo na stronie sekcja stoi na samym dole (pod parametrami).
      - label: "Inne realizacje z inwestycji"
        name: "related"
        widget: "list"
        label_singular: "Realizacja"
        required: false # pusta lista = brak sekcji w detalu
        hint: >-
          Opcjonalne. Dodaj realizacje z tej samej inwestycji — na stronie
          pojawią się na dole opisu jako lista linków. Kolejność jak tutaj.
          Bez pozycji sekcja w ogóle się nie wyświetla.
        field:
          label: "Realizacja"
          name: "realizacja"
          widget: "relation"
          collection: "realizacje"
          value_field: "{{slug}}"
          display_fields: ["{{title}} — {{place}} ({{year}})"]
          search_fields: ["title", "place"]
          dropdown_threshold: 0
          filters:
            - { field: "slug", values: ["{{slug}}"], exclude: true }
